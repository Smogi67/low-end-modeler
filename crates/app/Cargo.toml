[package]
name = "mixer"
description = "Small 3D modeler for low-end Windows laptops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mixer-mesh = { path = "../mesh" }
glow = "0.18"
imgui = "0.12"
sdl2 = { version = "0.38", default-features = false, features = ["raw-window-handle"] }
# The newer rendering engines: Vulkan, DirectX 12 and OpenGL 3.3 (Stage 10 step 4).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "gles", "vulkan", "wgsl"] }
pollster = "0.4"
raw-window-handle = "0.6"
# Windows file dialogs, message boxes, the Documents folder and the local time. Only used on Windows, but kept for every
# platform so the Windows code can be type-checked anywhere (see `platform.rs`).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# On Windows, SDL2 is built from source only to get its import library. The .exe
# then needs SDL2.dll, which the setup program downloads (owner's decision,
# 2026-11-07, spec section 6). The DLL loads late, so a missing one gets a clear
# message instead of a Windows error. See build.rs.
[dev-dependencies]
# Checks the WGSL shaders in tests, without a graphics card.
naga = { version = "30", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.38", default-features = false, features = ["bundled", "raw-window-handle"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(check_windows)"] }
