[package]
name = "low-end-modeler"
description = "Small 3D modeler for low-end Windows laptops."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
glow = "0.18"
sdl2 = { version = "0.38", default-features = false }

# On Windows, build SDL2 from source and link it into the .exe, so test builds
# need no separate SDL2.dll. Review this with the owner when the dependency
# installer is designed (spec section 6).
[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.38", default-features = false, features = ["bundled", "static-link"] }
