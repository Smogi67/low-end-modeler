name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The SDL2 source bundled by the sdl2 crate asks for a CMake version older than
  # current CMake still accepts. This lets the current CMake build it anyway.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Run tests
        run: cargo test --workspace

      - name: Build the app and the launcher
        run: cargo build --release --package mixer --package mixer-launcher

      # The release zip: both programs, the README, the font licenses and the version.
      # SDL2.dll is left out on purpose; the launcher downloads it (spec section 6).
      - name: Put the release folder together
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Output "Version $version"
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force release/licenses | Out-Null
          Copy-Item target/release/mixer.exe release/
          Copy-Item target/release/mixer-launcher.exe release/
          Set-Content -NoNewline -Encoding ascii release/version.txt $version
          Copy-Item dist/README.txt release/
          Copy-Item crates/app/assets/fonts/Inter-LICENSE.txt release/licenses/
          Copy-Item crates/app/assets/fonts/Lucide-LICENSE.txt release/licenses/
          foreach ($file in Get-ChildItem release -Recurse -File) {
            $megabytes = [math]::Round($file.Length / 1MB, 2)
            Write-Output "$($file.Name): $megabytes MB"
          }
          if ((Get-Item release/mixer.exe).Length -gt 10MB) {
            Write-Output "::warning::The app is over the 10 MB goal"
          }
          if (Test-Path release/SDL2.dll) { throw "SDL2.dll must not ship in the zip" }

      # The app must load SDL2.dll late, so a missing one gets a clear message.
      - name: Check how the app loads SDL2.dll
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $report = & $dumpbin /DEPENDENTS release/mixer.exe | Out-String
          Write-Output $report
          $delayed = $report.Substring($report.IndexOf("delay load"))
          if ($report.IndexOf("delay load") -lt 0 -or $delayed -notmatch "SDL2.dll") {
            throw "SDL2.dll is not delay-loaded"
          }
          $launcher = & $dumpbin /DEPENDENTS release/mixer-launcher.exe | Out-String
          Write-Output $launcher
          if ($launcher -match "SDL2") { throw "the launcher must not need SDL2" }

      # Runs the launcher's real download, check and install, in a copy of the folder.
      - name: Run the launcher without a window
        shell: pwsh
        run: |
          Copy-Item -Recurse release trial
          $process = Start-Process -FilePath trial/mixer-launcher.exe -ArgumentList "--no-window" -Wait -PassThru -NoNewWindow -RedirectStandardOutput launcher-output.txt
          Get-Content launcher-output.txt
          if ($process.ExitCode -ne 0) { throw "the launcher failed with code $($process.ExitCode)" }
          if (-not (Test-Path trial/SDL2.dll)) { throw "the launcher did not install SDL2.dll" }
          if (-not (Test-Path trial/README-SDL.txt)) { throw "the launcher did not install README-SDL.txt" }
          # A second run finds everything in place and downloads nothing.
          $again = Start-Process -FilePath trial/mixer-launcher.exe -ArgumentList "--no-window" -Wait -PassThru -NoNewWindow -RedirectStandardOutput launcher-again.txt
          Get-Content launcher-again.txt
          if ($again.ExitCode -ne 0) { throw "second launcher run failed" }
          if (-not (Select-String -Path launcher-again.txt -Pattern "already installed" -Quiet)) { throw "second run should find SDL2 installed" }

      # A new version number in Cargo.toml publishes the zip and its fingerprint as a
      # GitHub Release named v<version>, which the Mixer Launcher updates from. Pushes
      # that keep the version publish nothing.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $tag already exists; nothing to publish."
            exit 0
          }
          $zip = "mixer-$env:VERSION-windows.zip"
          Compress-Archive -Path release/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii "$zip.sha256" "$hash  $zip`n"
          Get-Content "$zip.sha256"
          gh release create $tag $zip "$zip.sha256" --target $env:GITHUB_SHA --title "Mixer $env:VERSION" --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }

      # The real update, from the newest release on GitHub, into a copy of the folder
      # that pretends to be version 0.0.1. Before the first release there is nothing to
      # update from, which is fine.
      - name: Update an old copy from the newest release
        shell: pwsh
        run: |
          Copy-Item -Recurse trial updating
          Set-Content -NoNewline -Encoding ascii updating/version.txt "0.0.1"
          $process = Start-Process -FilePath updating/mixer-launcher.exe -ArgumentList "--no-window","--update" -Wait -PassThru -NoNewWindow -RedirectStandardOutput update-output.txt
          Get-Content update-output.txt
          if ($process.ExitCode -ne 0) { throw "the update failed with code $($process.ExitCode)" }
          if (Select-String -Path update-output.txt -Pattern "up to date" -Quiet) {
            Write-Output "No release to update from yet."
          } else {
            $now = Get-Content updating/version.txt
            Write-Output "Version after the update: $now"
            if ($now -eq "0.0.1") { throw "the update did not change version.txt" }
            if (-not (Test-Path updating/mixer-launcher.old.exe)) { throw "the running launcher was not moved aside" }
            if (-not (Test-Path updating/SDL2.dll)) { throw "the update removed SDL2.dll" }
          }

      # Repair puts Mixer's own files back from the release of its version.
      - name: Repair a damaged copy
        shell: pwsh
        run: |
          Copy-Item -Recurse trial repairing
          Set-Content -NoNewline -Encoding ascii repairing/mixer.exe "damaged"
          Remove-Item repairing/README.txt
          $process = Start-Process -FilePath repairing/mixer-launcher.exe -ArgumentList "--no-window","--repair" -Wait -PassThru -NoNewWindow -RedirectStandardOutput repair-output.txt
          Get-Content repair-output.txt
          if (Select-String -Path repair-output.txt -Pattern "nothing at that address" -Quiet) {
            Write-Output "No release to repair from yet."
          } else {
            if ($process.ExitCode -ne 0) { throw "repair failed with code $($process.ExitCode)" }
            if ((Get-Item repairing/mixer.exe).Length -lt 100000) { throw "repair did not put mixer.exe back" }
            if (-not (Test-Path repairing/README.txt)) { throw "repair did not put README.txt back" }
          }

      # Screenshots of the real windows, printed into this log as text so they can be
      # checked without downloading anything: the launcher's pages, and the app's
      # message when SDL2.dll is missing.
      - name: Take screenshots
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
            $bitmap.Save("$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $text = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$name.png"))
            Write-Output "SHOT $name BEGIN"
            for ($i = 0; $i -lt $text.Length; $i += 2000) {
              Write-Output ("SHOT " + $text.Substring($i, [Math]::Min(2000, $text.Length - $i)))
            }
            Write-Output "SHOT $name END"
          }
          # A fresh folder: the welcome page, with SDL2 still to get.
          Copy-Item -Recurse release fresh1
          $first = Start-Process -FilePath fresh1/mixer-launcher.exe -PassThru
          Start-Sleep -Seconds 8
          Shot "launcher-welcome"
          Stop-Process -Id $first.Id -Force
          # Ready to start, with an update offered (shown without asking GitHub).
          Copy-Item -Recurse trial ready1
          $ready = Start-Process -FilePath ready1/mixer-launcher.exe -ArgumentList "--show-update" -PassThru
          Start-Sleep -Seconds 6
          Shot "launcher-home"
          Stop-Process -Id $ready.Id -Force
          Copy-Item -Recurse trial ready2
          $advanced = Start-Process -FilePath ready2/mixer-launcher.exe -ArgumentList "--page","advanced" -PassThru
          Start-Sleep -Seconds 6
          Shot "launcher-advanced"
          Stop-Process -Id $advanced.Id -Force
          # Install and start, as pressed: the steps, then Mixer opens.
          Copy-Item -Recurse release fresh2
          $second = Start-Process -FilePath fresh2/mixer-launcher.exe -ArgumentList "--press-continue" -PassThru
          Start-Sleep -Milliseconds 1500
          Shot "launcher-working"
          Start-Sleep -Seconds 10
          Shot "launcher-started-mixer"
          Get-Process mixer -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
          # A real update from the newest release, into a copy pretending to be older.
          Copy-Item -Recurse trial old1
          $updating = Start-Process -FilePath old1/mixer-launcher.exe -ArgumentList "--pretend-version","0.0.1","--update-now" -PassThru
          Start-Sleep -Milliseconds 2500
          Shot "launcher-updating"
          Start-Sleep -Seconds 8
          Get-Process mixer -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $updating.Id -Force -ErrorAction SilentlyContinue
          Copy-Item -Recurse release fresh3
          $app = Start-Process -FilePath fresh3/mixer.exe -PassThru
          Start-Sleep -Seconds 6
          Shot "app-without-sdl"
          Stop-Process -Id $app.Id -Force
          # The newer rendering engines. GitHub's Windows machine has no graphics card,
          # but Windows' own software adapter (WARP) runs DirectX 12. The others are
          # missing there, so Mixer must fall back to OpenGL 2.1, which is too old there
          # too, and then to DirectX 12.
          Copy-Item -Recurse trial engines1
          New-Item -ItemType Directory -Force engineshome | Out-Null
          $env:MIXER_HOME = (Resolve-Path engineshome).Path
          Start-Process -FilePath engines1/mixer.exe -ArgumentList "--check-engines" -Wait
          Get-Content engineshome/engines.txt
          foreach ($engine in "directx12", "vulkan", "opengl3.3", "opengl2.1") {
            Set-Content -Encoding ascii engineshome/settings.txt "renderer $engine"
            $run = Start-Process -FilePath engines1/mixer.exe -PassThru
            Start-Sleep -Seconds 10
            Shot "app-$engine"
            Stop-Process -Id $run.Id -Force -ErrorAction SilentlyContinue
            Get-Process mixer -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Output "--- mixer.log after $engine"
            Get-Content engines1/mixer.log -Tail 8
          }

      - name: Upload the release folder
        uses: actions/upload-artifact@v4
        with:
          name: mixer
          path: release/
          if-no-files-found: error
